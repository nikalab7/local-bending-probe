name: Probe checks

on:
  push:
    branches: [v2-benchmark-rebuild]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  measurement-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install scientific dependencies
        run: python -m pip install numpy scikit-learn
      - name: Run focused regressions
        run: python -m unittest discover -s v2 -p 'test_*.py' -v
      - name: Run seed estimator self-test
        run: python v2/seed_test.py --selftest
      - name: Run full ideal-geometry measurement gate
        working-directory: v2
        run: python measurement_gate.py
